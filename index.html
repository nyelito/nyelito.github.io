<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nick Yelito — software developer.">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <title>Nick Yelito</title>
  <link rel="icon" href="images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #111318;
      --muted: #5b6070;
      --border: #e4e5ea;
      --accent: #4f46e5;
      --accent-text: #ffffff;
      --glow: rgba(79, 70, 229, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0d12;
        --card: #13161d;
        --text: #eef0f4;
        --muted: #9aa0ae;
        --border: #232733;
        --accent: #818cf8;
        --accent-text: #0b0d12;
        --glow: rgba(129, 140, 248, 0.22);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, var(--glow), transparent 60%);
      background-repeat: no-repeat;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 40px -12px rgba(0, 0, 0, 0.15);
    }
    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 3px solid var(--card);
      box-shadow: 0 0 0 2px var(--accent);
      object-fit: cover;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .role { color: var(--accent); font-weight: 500; margin-top: 4px; }
    p.about { color: var(--muted); line-height: 1.6; margin: 20px 0 28px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px -6px var(--accent); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }
    footer { color: var(--muted); font-size: 0.85rem; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="https://github.com/nyelito.png" alt="Nick Yelito" width="112" height="112">
    <h1>Nick Yelito</h1>
    <div class="role">Software Developer</div>
    <p class="about">I enjoy building apps that I find useful or interesting myself. Check out what I'm working on over on GitHub.</p>
    <a class="btn" href="https://github.com/nyelito" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      github.com/nyelito
    </a>
  </main>
  <footer>&copy; <span id="y">2026</span> Nick Yelito</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
